[package]
name = "agent-hub"
version = "1.0.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
dirs = "6"
sha2 = "0.10"
walkdir = "2"
similar = "2"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "sync"] }
tauri-plugin-opener = "2.7.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
